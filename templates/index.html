<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extractor de perfiles de TikTok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1EC;
    --ink: #1B2A2F;
    --muted: #5B6B6E;
    --panel: #FFFFFF;
    --line: #D3DAD3;
    --accent: #0F6E63;
    --danger: #A33A1B;
    --danger-bg: #FBEDE7;
    --warn-bg: #FFF4D6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 48px 20px 90px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 8px; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 1.15rem; margin: 40px 0 12px; font-weight: 600; }
  .lead { color: var(--muted); margin: 0 0 28px; max-width: 60ch; }

  .row { display: flex; gap: 10px; }
  .field {
    flex: 1; display: flex; align-items: center;
    background: var(--panel); border: 1.5px solid var(--line);
    border-radius: 8px; padding: 0 14px;
  }
  .field:focus-within { border-color: var(--accent); outline: 3px solid rgba(15,110,99,.2); }
  .field .at { color: var(--muted); margin-right: 4px; }
  .field input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; padding: 13px 0; color: inherit; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 0;
    border-radius: 8px; padding: 0 22px; min-height: 48px;
  }
  button:hover { background: #0B5A51; }
  button:focus-visible, a:focus-visible, input[type=checkbox]:focus-visible { outline: 3px solid rgba(15,110,99,.45); outline-offset: 2px; }
  button:disabled { background: #7FA8A2; cursor: progress; }
  .opt { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: .95rem; }

  .status { margin-top: 20px; padding: 12px 14px; border-radius: 8px; }
  .status.busy { background: var(--panel); border: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .status.error { background: var(--danger-bg); color: var(--danger); }
  .status.warn { background: var(--warn-bg); }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: var(--line); } }

  dl.profile { display: grid; grid-template-columns: max-content 1fr; gap: 8px 28px; margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
  dl.profile dt { color: var(--muted); }
  dl.profile dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; }
  a.download { display: inline-block; background: var(--panel); color: var(--accent); border: 1.5px solid var(--accent); border-radius: 8px; padding: 9px 16px; font-weight: 600; text-decoration: none; }
  a.download:hover { background: #E3EEEC; }

  ol.videos { list-style: none; margin: 16px 0 0; padding: 0; }
  ol.videos > li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; }
  .video-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
  .video-head a { color: var(--accent); font-weight: 500; }
  .desc { margin: 8px 0 12px; max-width: 70ch; overflow-wrap: anywhere; }
  .desc.empty, .nocomments { color: var(--muted); font-style: italic; }
  ul.comments { margin: 0; padding: 0 0 0 14px; list-style: none; border-left: 3px solid var(--line); }
  ul.comments li { padding: 3px 0; overflow-wrap: anywhere; }
  .comments-title { font-size: .9rem; color: var(--muted); margin: 0 0 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Extractor de perfiles de TikTok</h1>
  <p class="lead">Escribe el usuario de un perfil público. Obtendrás sus datos básicos, la descripción de sus primeros 10 videos y los primeros 5 comentarios de cada uno.</p>

  <form id="form" autocomplete="off">
    <div class="row">
      <label class="field">
        <span class="at">@</span>
        <input id="username" name="username" placeholder="nombre.de.usuario" aria-label="Usuario de TikTok" required>
      </label>
      <button id="submit" type="submit">Extraer datos</button>
    </div>
    <label class="opt">
      <input id="show" type="checkbox">
      Mostrar el navegador mientras trabaja (necesario si TikTok pide un captcha)
    </label>
  </form>

  <div id="status" hidden></div>

  <section id="results" hidden>
    <h2>Perfil</h2>
    <dl class="profile" id="profile"></dl>

    <div class="toolbar" style="margin-top:40px">
      <h2>Videos y comentarios</h2>
      <a class="download" id="download" href="#">Descargar CSV</a>
    </div>
    <ol class="videos" id="videos"></ol>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => typeof n === "number" ? new Intl.NumberFormat("es-ES").format(n) : (n || "—");

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    children.forEach((c) => node.append(c));
    return node;
  }

  function setStatus(kind, text, spinner = false) {
    const box = $("status");
    box.className = "status " + kind;
    box.replaceChildren();
    if (spinner) box.append(el("span", { className: "spinner" }));
    box.append(el("span", { textContent: text }));
    box.hidden = false;
  }

  function render(data) {
    const p = data.profile;
    $("profile").replaceChildren(
      el("dt", { textContent: "Usuario" }),    el("dd", { textContent: "@" + p.username }),
      el("dt", { textContent: "Nombre" }),     el("dd", { textContent: p.name || "—" }),
      el("dt", { textContent: "Seguidores" }), el("dd", { textContent: fmt(p.followers) }),
      el("dt", { textContent: "Siguiendo" }),  el("dd", { textContent: fmt(p.following) })
    );

    $("videos").replaceChildren(...data.videos.map((v, i) => {
      const comments = v.comments.length
        ? el("ul", { className: "comments" }, ...v.comments.map((c) => el("li", { textContent: c })))
        : el("p", { className: "nocomments", textContent: "No se pudieron leer comentarios (desactivados o TikTok bloqueó la página del video)." });
      return el("li", {},
        el("div", { className: "video-head" },
          el("span", { textContent: "Video " + (i + 1) }),
          el("a", { href: v.url, target: "_blank", rel: "noopener", textContent: "Abrir en TikTok" })),
        el("p", { className: "desc" + (v.description ? "" : " empty"), textContent: v.description || "Sin descripción" }),
        el("p", { className: "comments-title", textContent: "Primeros comentarios" }),
        comments);
    }));

    $("download").href = "/download/" + encodeURIComponent(data.csv_file);
    $("results").hidden = false;
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = $("username").value.trim().replace(/^@/, "");
    if (!username) return setStatus("error", "Escribe un nombre de usuario.");

    $("results").hidden = true;
    $("submit").disabled = true;
    setStatus("busy", "Extrayendo datos de @" + username + ". Puede tardar uno o dos minutos…", true);

    try {
      const res = await fetch("/api/scrape", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, show_browser: $("show").checked }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error desconocido.");

      render(data);
      if (data.warnings.length) setStatus("warn", data.warnings.join(" "));
      else $("status").hidden = true;
    } catch (err) {
      setStatus("error", err.message);
    } finally {
      $("submit").disabled = false;
    }
  });
</script>
</body>
</html>
